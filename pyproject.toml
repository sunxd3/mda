[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-discovery-agent"
version = "0.1.0"
description = "A paper-faithful implementation of the Model Discovery Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["openai>=1.100", "anthropic>=0.79"]
numpyro = ["numpyro>=0.19", "jax>=0.4.25"]
physics = [
    "physchool @ git+https://github.com/SampsonML/DiscoverPhysics.git@33b7fa9df96de9c35744efd181ca7e5a8dd60ad5#subdirectory=PhysicsSchool",
    "ScienceAgent @ git+https://github.com/SampsonML/DiscoverPhysics.git@33b7fa9df96de9c35744efd181ca7e5a8dd60ad5#subdirectory=ScienceAgent",
]
design = ["cma>=4.0"]
bic = ["scipy>=1.11"]
recovery = ["scipy>=1.11", "sympy>=1.12"]
neuron = [
    "neuronbench @ git+https://github.com/murphyk/neuronbench.git@c354622458c460b419cab821d482c879f0578377",
]
glucose = [
    "glucosebench @ git+https://github.com/murphyk/glucosebench.git@6bb0ff6f44513e1e816ac3f0827531a366e8d7a0",
    "scipy>=1.11",
]
baselines = ["neurobench>=2.3.0"]
dev = [
    "pytest>=8.0",
    "model-discovery-agent[bic,design,glucose,llm,neuron,numpyro,recovery]",
]

[project.scripts]
mda-toy = "mda.benchmarks.toy:main"
mda-neuron-baseline = "mda.benchmarks.neuron:main"
mda-reproduce = "mda.benchmarks.reproduce:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: calls a paid external API (disabled unless RUN_LIVE_OPENAI=1)",
    "slow: takes more than a few seconds",
]
